const BD = (() => {

    const r = indexedDB.open('acierta-verifica', 1);
    r.onupgradeneeded = () => { r.result.createObjectStore('expedientes', {keyPath: 'folio'}); r.result.createObjectStore('fotos', {keyPath: 'id'}); };

  });
  const tx = (tienda, modo, fn) => abrir().then(d => new Promise((ok, mal) => {
    const t = d.transaction(tienda, modo); const s = t.objectStore(tienda); const res = fn(s);
    t.oncomplete = () => ok(res && res.result !== undefined ? res.result : res); t.onerror = () => mal(t.error);
  }));
  return {
    guardar: e => tx('expedientes', 'readwrite', s => s.put(e)),
    todos: () => tx('expedientes', 'readonly', s => s.getAll()),
    borrar: f => tx('expedientes', 'readwrite', s => s.delete(f)),
    foto: (id, data) => tx('fotos', 'readwrite', s => s.put({id, data})),

  else if (p.jabonosa === 'sin') marca('gas', 'verde');

  if (pres.length) { const mx = Math.max(...pres), mn = Math.min(...pres);
    marca('hidraulico', mx > 80 ? 'amarillo' : mn < 5 ? 'amarillo' : 'verde', mx > 80 ? `Presión alta: ${mx} PSI` : mn < 5 ? `Presión baja: ${mn} PSI` : null); }
  if (num(p.presion_doble) != null && pres.length && num(p.presion_doble) <= Math.max(...pres) / 2) marca('hidraulico', 'amarillo', 'La presión cae a la mitad con dos salidas abiertas');
  if (p.medidor === 'avanza') marca('hidraulico', 'amarillo', 'El medidor avanza con todo cerrado (posible fuga)');
  if (num(p.agua_caliente) != null && num(p.agua_caliente) > 60) marca('hidraulico', 'amarillo', `Agua caliente tarda ${num(p.agua_caliente)} s`);
  [num(p.volt_cerca), num(p.volt_lejos)].forEach(v => { if (v != null) marca('electrico', v < 114 || v > 135 ? 'amarillo' : 'verde', v < 114 || v > 135 ? `Voltaje fuera de rango: ${v} V` : null); });

}

function comprimir(file) { return new Promise((ok, mal) => { const img = new Image(); const url = URL.createObjectURL(file);
  img.onload = () => { const max = 1400; let {width: w, height: h} = img; if (w > max || h > max) { const f = max / Math.max(w, h); w = Math.round(w * f); h = Math.round(h * f); }
    const c = document.createElement('canvas'); c.width = w; c.height = h; c.getContext('2d').drawImage(img, 0, 0, w, h); URL.revokeObjectURL(url); ok(c.toDataURL('image/jpeg', 0.72)); };
  img.onerror = () => { URL.revokeObjectURL(url); mal(new Error('imagen')); }; img.src = url; }); }
