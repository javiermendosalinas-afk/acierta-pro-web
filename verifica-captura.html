<script>

const SISTEMAS = {estructura:'Estructura visible', humedad:'Humedad e impermeabilización', electrico:'Instalación eléctrica', hidraulico:'Hidráulico y sanitario', gas:'Gas', acabados:'Acabados y carpintería'};

const CASA_TIPO = ['Exterior y fachada','Azotea','Estacionamiento','Cisterna e hidroneumático','Instalación de gas','Tablero eléctrico',

// [documento, qué verificar, crítico]
const DOCUMENTOS = [
  ['Identificación oficial del vendedor','Vigente; el nombre coincide con la escritura',1],

  ['Agua (SIAPA u organismo local)','Constancia de no adeudo o último recibo pagado',0],

const ESTADOS_DOC = [['ok','Correcto'],['obs','Con observación'],['alerta','Con alerta'],['tramite','En trámite'],['np','No presentado'],['na','No aplica']];
function plazoDoc(nombre) { const n = nombre.toLowerCase();
  if (n.includes('gravámenes')) return [5, 'Certificado de libertad o gravamen del RPP: 5 días hábiles (urgente en 24 h al doble)'];
  if (n.includes('registro público')) return [1, 'Consulta de folio real en línea'];
  if (n.includes('licencias') || n.includes('uso de suelo')) return [10, 'Dictamen o constancia municipal: alrededor de 10 días hábiles'];
  if (n.includes('poder') || n.includes('sucesión')) return [3, 'Verificación por el notario de la operación'];
  if (n.includes('agua')) return [3, 'Constancia de no adeudo del organismo de agua'];
  if (n.includes('predial')) return [1, 'Constancia de no adeudo predial'];
  if (n.includes('condominio')) return [3, 'Copias del régimen y constancia del administrador'];

function sumarHabiles(fechaISO, dias) { const d = new Date((fechaISO || hoy()) + 'T12:00:00'); let n = 0; while (n < dias) { d.setDate(d.getDate() + 1); if (d.getDay() !== 0 && d.getDay() !== 6) n++; } return d.toISOString().slice(0, 10); }

const RANGOS = {
  presion_baja: {l: 'Presión en planta baja', u: 'PSI', esc: [0, 100], zonas: [[0, 5, 'a'], [5, 60, 'v'], [60, 80, 'a'], [80, 100, 'r']], imp: {v: 'Presión adecuada para el uso diario.', a: 'Presión fuera de lo ideal: revisar tinaco, bomba o regulador.', r: 'Presión excesiva: riesgo de fugas y daño en conexiones.'}},
  presion_alta: {l: 'Presión en el punto más alto', u: 'PSI', esc: [0, 100], zonas: [[0, 5, 'a'], [5, 60, 'v'], [60, 80, 'a'], [80, 100, 'r']], imp: {v: 'Llega agua con presión suficiente a la planta alta.', a: 'Poca presión en la planta alta; puede requerir presurizador.', r: 'Presión excesiva: riesgo de fugas.'}},
  agua_caliente: {l: 'Tiempo para agua caliente', u: 's', esc: [0, 120], zonas: [[0, 60, 'v'], [60, 120, 'a']], imp: {v: 'El agua caliente llega en tiempo razonable.', a: 'Tarda en llegar: desperdicio de agua y gas.'}},
  volt_cerca: {l: 'Voltaje junto al tablero', u: 'V', esc: [100, 145], zonas: [[100, 114, 'a'], [114, 135, 'v'], [135, 145, 'a']], imp: {v: 'Voltaje dentro de norma.', a: 'Voltaje fuera de norma: puede dañar aparatos.'}},
  volt_lejos: {l: 'Voltaje en el contacto más lejano', u: 'V', esc: [100, 145], zonas: [[100, 114, 'a'], [114, 135, 'v'], [135, 145, 'a']], imp: {v: 'Sin caída de voltaje relevante.', a: 'Caída de voltaje: cableado delgado o conexiones flojas.'}},
  co_calentador: {l: 'Monóxido de carbono junto al calentador', u: 'ppm', esc: [0, 60], zonas: [[0, 9, 'v'], [9, 35, 'a'], [35, 60, 'r']], imp: {v: 'Combustión correcta.', a: 'Combustión deficiente: dar mantenimiento al calentador.', r: 'Riesgo de intoxicación: no usar hasta reparar.'}},
  co_estufa: {l: 'Monóxido de carbono junto a la estufa', u: 'ppm', esc: [0, 60], zonas: [[0, 9, 'v'], [9, 35, 'a'], [35, 60, 'r']], imp: {v: 'Combustión correcta.', a: 'Combustión deficiente: limpiar quemadores y revisar ventilación.', r: 'Riesgo de intoxicación: no usar hasta reparar.'}},
  nivel_sala: {l: 'Desnivel en sala y comedor', u: 'mm', esc: [0, 30], zonas: [[0, 10, 'v'], [10, 20, 'a'], [20, 30, 'r']], imp: {v: 'Pisos dentro de tolerancia.', a: 'Desnivel visible: revisar firme y asentamientos.', r: 'Posible asentamiento: perito estructural.'}},
  nivel_recamara: {l: 'Desnivel en recámara principal', u: 'mm', esc: [0, 30], zonas: [[0, 10, 'v'], [10, 20, 'a'], [20, 30, 'r']], imp: {v: 'Pisos dentro de tolerancia.', a: 'Desnivel visible: revisar firme y asentamientos.', r: 'Posible asentamiento: perito estructural.'}}

function pendientes(e) {

const ORDEN = {gris: 0, verde: 1, amarillo: 2, rojo: 3};

function evaluar(e) {

  const marca = (k, color, nota) => { sis[k].color = peor(sis[k].color, color); if (nota) sis[k].notas.push(nota); };
  e.zonas.forEach(z => z.items.forEach(i => {
    if (i.e === 'ok') marca(i.s, 'verde');

    else if (i.e === 'falla') marca(i.s, i.c ? 'rojo' : 'amarillo', `${z.nombre}: ${i.t}`);
  }));
  const p = e.pruebas;
  const co = Math.max(num(p.co_calentador) || 0, num(p.co_estufa) || 0);
  if (num(p.co_calentador) != null || num(p.co_estufa) != null) marca('gas', co > 35 ? 'rojo' : co > 9 ? 'amarillo' : 'verde', co > 9 ? `Monóxido de carbono ${co} ppm` : null);
  if (p.detector_gas === 'fuga') marca('gas', 'rojo', 'Alarma del detector de gas combustible (HT609Pro)');
  else if (p.detector_gas === 'sin') marca('gas', 'verde');
  if (p.jabonosa === 'fuga') marca('gas', 'rojo', 'Fuga de gas confirmada con agua jabonosa');
  else if (p.jabonosa === 'sin') marca('gas', 'verde');
  const pres = [num(p.presion_baja), num(p.presion_alta)].filter(x => x != null);
  if (pres.length) { const mx = Math.max(...pres), mn = Math.min(...pres);
    marca('hidraulico', mx > 80 ? 'amarillo' : mn < 5 ? 'amarillo' : 'verde', mx > 80 ? `Presión alta: ${mx} PSI` : mn < 5 ? `Presión baja: ${mn} PSI` : null); }
  if (num(p.presion_doble) != null && pres.length && num(p.presion_doble) <= Math.max(...pres) / 2) marca('hidraulico', 'amarillo', 'La presión cae a la mitad con dos salidas abiertas');
  if (p.medidor === 'avanza') marca('hidraulico', 'amarillo', 'El medidor avanza con todo cerrado (posible fuga)');
  if (num(p.agua_caliente) != null && num(p.agua_caliente) > 60) marca('hidraulico', 'amarillo', `Agua caliente tarda ${num(p.agua_caliente)} s`);
  [num(p.volt_cerca), num(p.volt_lejos)].forEach(v => { if (v != null) marca('electrico', v < 114 || v > 135 ? 'amarillo' : 'verde', v < 114 || v > 135 ? `Voltaje fuera de rango: ${v} V` : null); });
  if (num(p.contactos_falla) > 0) marca('electrico', 'amarillo', `${num(p.contactos_falla)} de ${num(p.contactos) || '?'} contactos con falla`);
  [['nivel_sala', 'sala'], ['nivel_recamara', 'recámara principal']].forEach(([k, l]) => { const v = num(p[k]); if (v != null) marca('estructura', v > 20 ? 'rojo' : v > 10 ? 'amarillo' : 'verde', v > 10 ? `Desnivel de ${v} mm en ${l}` : null); });
  // documental
  const doc = {color: 'gris', notas: []};
  e.documentos.forEach(d => {
    const c = d.e === 'ok' ? 'verde' : d.e === 'obs' ? 'amarillo' : d.e === 'alerta' ? (d.c ? 'rojo' : 'amarillo') : d.e === 'np' ? 'amarillo' : 'gris';
    doc.color = peor(doc.color, c); if (['obs', 'alerta', 'np'].includes(d.e)) doc.notas.push(`${d.d}: ${d.e === 'np' ? 'no presentado' : d.e === 'alerta' ? 'con alerta' : 'con observación'}`);
  });

}

function comprimir(file) { return new Promise((ok, mal) => { const img = new Image(); const url = URL.createObjectURL(file);
  img.onload = () => { const max = 1400; let {width: w, height: h} = img; if (w > max || h > max) { const f = max / Math.max(w, h); w = Math.round(w * f); h = Math.round(h * f); }
    const c = document.createElement('canvas'); c.width = w; c.height = h; c.getContext('2d').drawImage(img, 0, 0, w, h); URL.revokeObjectURL(url); ok(c.toDataURL('image/jpeg', 0.72)); };
