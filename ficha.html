<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ficha de propiedad | Acierta Max</title>
<meta property="og:type" content="website">
<meta property="og:title" content="Ficha de propiedad | Acierta Max">
<meta property="og:description" content="Precio, análisis de zona, mapa y propiedades similares — mira el detalle completo de esta propiedad en Acierta Max, Guadalajara.">
<meta property="og:image" content="https://acierta.pro/assets/verifica/hero-termografia.jpg">
<meta property="og:url" content="https://acierta.pro/ficha.html">
<meta property="og:site_name" content="Acierta Max">
<meta property="og:locale" content="es_MX">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Ficha de propiedad | Acierta Max">
<meta name="twitter:description" content="Precio, análisis de zona, mapa y propiedades similares — mira el detalle completo de esta propiedad en Acierta Max, Guadalajara.">
<meta name="twitter:image" content="https://acierta.pro/assets/verifica/hero-termografia.jpg">
<meta name="description" content="Precio, análisis de zona, mapa y propiedades similares — mira el detalle completo de esta propiedad en Acierta Max, Guadalajara.">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="assets/vendor/leaflet/leaflet.css">
<style>
.ficha-foto{position:relative}
.ficha-col-foto{min-width:0}
.galeria-btn{position:absolute;right:14px;bottom:14px;background:rgba(10,31,63,.86);color:#fff;border:0;border-radius:999px;padding:10px 16px;font-weight:700;cursor:pointer}
.galeria-tiras{display:flex;gap:8px;margin-top:10px;overflow-x:auto}
.galeria-tiras button{flex:none;width:86px;height:64px;border:0;padding:0;border-radius:8px;overflow:hidden;cursor:pointer;background:#e8edf3}
.galeria-tiras img{width:100%;height:100%;object-fit:cover;display:block}.galeria-tiras .mas{font-weight:800;color:#0a1f3f;font-size:18px}
.visor{position:fixed;inset:0;z-index:9999;background:rgba(5,12,26,.96);display:flex;align-items:center;justify-content:center}
.visor img{max-width:94vw;max-height:86vh;object-fit:contain;border-radius:6px}
.visor button{position:absolute;background:rgba(255,255,255,.12);color:#fff;border:0;cursor:pointer;border-radius:999px;width:52px;height:52px;font-size:34px;line-height:1}
.visor-x{top:16px;right:16px}.visor-ant{left:14px;top:50%;transform:translateY(-50%)}.visor-sig{right:14px;top:50%;transform:translateY(-50%)}
.visor-n{position:absolute;bottom:18px;left:0;right:0;text-align:center;color:#cfd8e6;font-size:15px}
.ficha-desc{white-space:pre-line;line-height:1.65;color:#1b2433}.ficha-desc.corta{max-height:13.5em;overflow:hidden;-webkit-mask-image:linear-gradient(#000 70%,transparent)}
.ficha-sub{font-size:1.05rem;margin:18px 0 8px}.btn-link{background:none;border:0;color:#d62828;font-weight:700;cursor:pointer;padding:8px 0}
</style>
</head>
<body class="pg">

<div class="pg-header">
  <a href="index.html" class="back">← Acierta Max</a>
  <span class="pg-titulo">Ficha de propiedad</span>
  <a href="mapa.html" class="pg-link">Buscar por zona</a>
</div>

<main class="ficha" id="ficha">
  <p class="pg-cargando">Cargando propiedad…</p>
</main>

<script src="assets/vendor/leaflet/leaflet.js"></script>
<script src="js/comun.js"></script>
<script>
(function () {
  const $ = id => document.getElementById(id);
  const qs = new URLSearchParams(location.search);
  const eb = qs.get('eb'), op = qs.get('op');
  const raiz = $('ficha');

  function noEncontrada(msg) {
    raiz.innerHTML = `<div class="ficha-card"><h2>No encontramos esa propiedad</h2>
      <p>${AM.esc(msg)}</p>
      <p><a class="btn-solid" style="display:inline-block;padding:10px 18px;border-radius:999px;text-decoration:none" href="index.html">Ver todas las propiedades</a></p></div>`;
  }

  function barraPosicion(an) {
    const d0 = Math.min(an.p10, an.pm2) * 0.92, d1 = Math.max(an.p90, an.pm2) * 1.08;
    const pos = v => Math.max(0, Math.min(100, (v - d0) / (d1 - d0) * 100));
    return `<div class="rango" aria-hidden="true">
      <div class="rango-zona" style="left:${pos(an.p25)}%;width:${pos(an.p75) - pos(an.p25)}%"></div>
      <div class="rango-med" style="left:${pos(an.mediana)}%"></div>
      <div class="rango-yo" style="left:${pos(an.pm2)}%"></div>
    </div>
    <div class="rango-leyenda">
      <span><i class="l-zona"></i> Rango típico (25%–75%): ${AM.money(an.p25)} – ${AM.money(an.p75)}</span>
      <span><i class="l-med"></i> Mediana: ${AM.money(an.mediana)}</span>
      <span><i class="l-yo"></i> Esta propiedad: ${AM.money(an.pm2)}</span>
    </div>`;
  }

  function analisisHTML(p, an) {
    const unidad = p.operacion === 'RENTA' ? '/m² al mes' : '/m²';
    if (!an.disponible) return `<p class="muted">${AM.esc(an.motivo)}</p>`;
    const menorQue = Math.round(an.percentil * 100);
    const frase = an.veredicto === 'bajo'
      ? `Su precio por m² está <b>${Math.round(Math.abs(an.diffPct) * 100)}% por debajo</b> de la mediana`
      : an.veredicto === 'alto'
        ? `Su precio por m² está <b>${Math.round(Math.abs(an.diffPct) * 100)}% por encima</b> de la mediana`
        : `Su precio por m² está <b>en línea</b> con la mediana (${an.diffPct >= 0 ? '+' : '−'}${Math.round(Math.abs(an.diffPct) * 100)}%)`;
    return `
      <p class="an-frase">${frase} de ${AM.esc(an.descripcion)} <span class="muted">(${an.n} propiedades comparables)</span>.</p>
      <div class="an-cifras">
        <div><b>${AM.money(an.pm2)}</b><span>${unidad} · esta propiedad</span></div>
        <div><b>${AM.money(an.mediana)}</b><span>${unidad} · mediana de la zona</span></div>
        <div><b>${menorQue}%</b><span>de las comparables cuestan menos por m²</span></div>
      </div>
      ${barraPosicion(an)}
      ${an.atipico ? '<p class="an-alerta">⚠️ Este precio se aleja mucho de lo normal en la zona. Puede ser un error de captura: confírmalo con un asesor antes de decidir.</p>' : ''}
      <p class="muted an-aviso">${AM.esc(AM.AVISO_ANALISIS)}</p>`;
  }

  function pintar(p, todas) {
    document.title = p.titulo + ' — Acierta Max';
    const an = AM.analisis(p, todas);
    const url = AM.fichaUrl(p);
    const wa = encodeURIComponent('Hola, me interesa esta propiedad: ' + p.titulo + ' (' + p.eb + ', ' + (p.operacion === 'RENTA' ? 'renta' : 'venta') + ') — ' + location.origin + '/' + url);
    const lugar = (p.colonia ? p.colonia + ', ' : '') + p.municipio;
    const pm2 = AM.precioM2(p);
    const chips = [];
    if (p.recamaras) chips.push(p.recamaras + ' recámaras');
    if (p.banos) chips.push(p.banos + ' baños');
    if (p.m2) chips.push(Math.round(p.m2).toLocaleString('es-MX') + ' m²');
    if (pm2) chips.push(AM.money(pm2) + (p.operacion === 'RENTA' ? '/m² al mes' : '/m²'));
    if (p.niveles) chips.push(p.niveles + (p.niveles === 1 ? ' planta' : ' plantas'));
    chips.push('Código ' + p.eb);
    const sim = p.operacion === 'VENTA'
      ? `<a class="btn-outline btn-lg" href="simulador.html?precio=${Math.round(p.precio)}">Simular crédito</a>` : '';
    const g = AM.grupoDe(p.tipo);
    const procUrl = 'proceso.html?modo=' + (p.operacion === 'RENTA' ? 'renta' : 'compra') + '&' + (p.operacion === 'RENTA' ? 'renta' : 'precio') + '=' + Math.round(p.precio) +
      '&mun=' + encodeURIComponent(p.municipio) + (g !== 'otro' ? '&tipo=' + g : '') + (p.recamaras ? '&rec=' + p.recamaras : '') + (p.m2 ? '&m2=' + Math.round(p.m2) : '');
    const otra = todas.find(x => x.eb === p.eb && x !== p && x.operacion !== p.operacion);
    const otraHTML = otra ? `<p class="ficha-otra">También está disponible en <b>${otra.operacion === 'RENTA' ? 'renta' : 'venta'}</b>
      (${AM.money(otra.precio)}${otra.operacion === 'RENTA' ? '/mes' : ''}) — <a href="${AM.fichaUrl(otra)}">ver esa ficha</a></p>` : '';
    const similares = AM.similares(p, todas, 4);

    raiz.innerHTML = `
    <div class="ficha-top">
      <div class="ficha-col-foto"><div class="ficha-foto" id="fichaFoto" ${p.foto ? 'style="background:#0f1f3d;cursor:zoom-in" role="button" tabindex="0" aria-label="Ver foto en pantalla completa"' : ''}>
        ${AM.iconHouse()}${p.foto ? AM.fotoImg(p.foto, 1200, 800, p.titulo) : ''}
        <span class="card-op">${AM.esc(p.operacion)}</span>
        ${p.foto ? '' : '<span class="ficha-sinfoto">Foto próximamente</span>'}
      </div></div>
      <div class="ficha-info">
        <div class="ficha-eyebrow">${p.operacion === 'RENTA' ? 'Renta' : 'Venta'} · ${AM.esc(p.tipo)} · ${AM.esc(lugar)}</div>
        <h1>${AM.esc(p.titulo)}</h1>
        <div class="ficha-precio">${AM.precioTxt(p)} <span>${AM.esMXN(p) ? 'MXN' : 'USD'}${p.operacion === 'RENTA' ? '/mes' : ''}</span></div>
        ${p.pm2_pub && p.m2 ? `<div class="ficha-pm2">Publicado a ${AM.money(p.pm2_pub)} ${AM.esMXN(p) ? 'MXN' : 'USD'} por m²${p.operacion === 'RENTA' ? ' al mes' : ''} · precio total calculado con ${Math.round(p.m2).toLocaleString('es-MX')} m²</div>` : ''}
        <div class="chips">${chips.map(c => `<span>${AM.esc(c)}</span>`).join('')}</div>
        ${otraHTML}
        <div class="ficha-cta">
          <a class="btn-solid btn-lg" id="btnHablarAsesor" href="https://wa.me/523333777337?text=${wa}" target="_blank" rel="noopener" data-wa-base="${wa}">Hablar con un asesor por WhatsApp</a>
          <button class="btn-cmp btn-lg" type="button" data-eb="${AM.esc(AM.clave(p))}" aria-pressed="false">＋ Comparar</button>
          ${sim}
          <a class="btn-outline btn-lg" href="${procUrl}">Iniciar mi proceso con esta propiedad</a>
        </div>
        ${AM.compartirHTML(p.titulo, location.origin + '/' + url)}
      </div>
    </div>

    <div id="fichaDetalle"></div>

    <section class="ficha-card" id="secAnalisis">
      <h2>¿Está bien de precio?</h2>
      ${analisisHTML(p, an)}
    </section>

    ${p.lat && p.lon ? `<section class="ficha-card"><h2>Ubicación</h2><div id="miniMapa"></div>
      <p class="muted">La ubicación en el mapa es aproximada.</p></section>` : ''}

    ${similares.length ? `<section class="ficha-card"><h2>Propiedades similares</h2>
      <div class="similares">${similares.map(s => AM.cardHTML(s)).join('')}</div></section>` : ''}

    ${AM.confianzaHTML()}

    ${/aciertamax\.com/.test(p.liga || '') ? `<p class="ficha-original">¿Quieres ver la publicación original con más fotos y descripción?
      <a href="${AM.esc(p.liga)}" target="_blank" rel="noopener">Abrir en aciertamax.com ↗</a></p>` : ''}`;

    // "Hablar con un asesor": la primera vez pide nombre y WhatsApp para asignar un asesor real
    document.getElementById('btnHablarAsesor').addEventListener('click', function (e) {
      if (AM.leadGuardado()) return;   // ya tiene lead: deja pasar directo al WhatsApp
      e.preventDefault();
      const base = this.dataset.waBase, href = this.href;
      AM.asegurarLead({ motivo: 'Para que un asesor de Acierta Max te dé seguimiento sobre esta propiedad.',
        operacion: p.operacion === 'RENTA' ? 'renta' : 'compra', municipio: p.municipio, notas: p.colonia })
        .then(lead => { window.open(lead && lead.vendedor ? href.replace(base, base + encodeURIComponent(' (folio ' + lead.folio + ')')) : href, '_blank', 'noopener'); });
    });

    if (p.lat && p.lon && window.L) {
      try {   // si el mapa falla, la ficha se queda funcionando sin él
        const m = L.map('miniMapa', { scrollWheelZoom: false, preferCanvas: true }).setView([p.lat, p.lon], 15);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OpenStreetMap', maxZoom: 19 }).addTo(m);
        L.circleMarker([p.lat, p.lon], { radius: 10, color: '#d62828', fillOpacity: 0.85 }).addTo(m);
      } catch (e) { console.error('mapa ficha:', e); const el = document.getElementById('miniMapa'); if (el) el.outerHTML = '<p class="muted">No se pudo mostrar el mapa.</p>'; }
    }
    // Galería: la foto principal se abre en grande; en NeoJaus se cargan todas las fotos y la descripción
    let fotos = p.foto ? [p.foto] : [];
    const caja = document.getElementById('fichaFoto');
    const abrir = i => { if (fotos.length) visor(fotos, i, p.titulo); };
    if (caja && p.foto) { caja.addEventListener('click', e => { if (!e.target.closest('.galeria-btn')) abrir(0); }); caja.addEventListener('keydown', e => { if (e.key === 'Enter') abrir(0); }); }
    if (/^NJ-/.test(p.eb)) {
      const archivo = p.eb.slice(-2).toLowerCase().replace(/[^a-z0-9]/g, '0');
      fetch('herramientas/neojaus/fichas/' + archivo + '.json').then(r => r.ok ? r.json() : {}).then(todo => {
        const d = todo[p.eb]; if (!d) return;
        if (d.uid && (d.fotos || []).length) fotos = d.fotos.map(n => 'https://cdn.neojaus.com/properties/' + d.uid + '/' + n);
        if (fotos.length > 1 && caja) {
          caja.insertAdjacentHTML('beforeend', `<button type="button" class="galeria-btn">Ver las ${fotos.length} fotos</button>`);
          caja.querySelector('.galeria-btn').addEventListener('click', e => { e.stopPropagation(); abrir(0); });
          caja.insertAdjacentHTML('afterend', `<div class="galeria-tiras">${fotos.slice(0, 8).map((f, i) => `<button type="button" data-i="${i}" aria-label="Foto ${i + 1}"><img src="${AM.esc(f)}" alt="" loading="lazy"></button>`).join('')}${fotos.length > 8 ? `<button type="button" data-i="8" class="mas">+${fotos.length - 8}</button>` : ''}</div>`);
          document.querySelectorAll('.galeria-tiras button').forEach(b => b.addEventListener('click', () => abrir(+b.dataset.i)));
        }
        const extras = [d.estacionamientos ? d.estacionamientos + ' estacionamiento' + (d.estacionamientos > 1 ? 's' : '') : '', d.medios_banos ? d.medios_banos + ' medio baño' + (d.medios_banos > 1 ? 's' : '') : '',
          d.mantenimiento ? 'Mantenimiento ' + AM.money(d.mantenimiento) + '/mes' : '', d.anio ? 'Construida en ' + d.anio : '', d.piso ? 'Piso ' + d.piso : ''].filter(Boolean);
        const amen = (d.amenidades || []).map(a => String(a).replace(/_/g, ' ')).map(a => a.charAt(0).toUpperCase() + a.slice(1));
        if (d.descripcion || extras.length || amen.length) document.getElementById('fichaDetalle').innerHTML = `<section class="ficha-card"><h2>Descripción</h2>
          ${d.descripcion ? `<div class="ficha-desc${d.descripcion.length > 700 ? ' corta' : ''}">${AM.esc(d.descripcion)}</div>${d.descripcion.length > 700 ? '<button type="button" class="btn-link" id="verMasDesc">Leer la descripción completa</button>' : ''}` : ''}
          ${extras.length ? `<h3 class="ficha-sub">Características</h3><div class="chips">${extras.map(c => `<span>${AM.esc(c)}</span>`).join('')}</div>` : ''}
          ${amen.length ? `<h3 class="ficha-sub">Amenidades</h3><div class="chips">${amen.map(c => `<span>${AM.esc(c)}</span>`).join('')}</div>` : ''}</section>`;
        const vm = document.getElementById('verMasDesc'); if (vm) vm.addEventListener('click', () => { document.querySelector('.ficha-desc').classList.remove('corta'); vm.remove(); });
      }).catch(() => {});
    }
    AM.actualizarUI();
  }

  // Visor de fotos a pantalla completa: flechas, teclado y deslizar con el dedo
  function visor(fotos, i, titulo) {
    const v = document.createElement('div'); v.className = 'visor'; v.setAttribute('role', 'dialog'); v.setAttribute('aria-label', 'Fotos de ' + titulo);
    v.innerHTML = `<button type="button" class="visor-x" aria-label="Cerrar">×</button><button type="button" class="visor-ant" aria-label="Foto anterior">‹</button>
      <img alt=""><button type="button" class="visor-sig" aria-label="Foto siguiente">›</button><div class="visor-n"></div>`;
    document.body.appendChild(v); document.body.style.overflow = 'hidden';
    const img = v.querySelector('img'), n = v.querySelector('.visor-n');
    const ver = k => { i = (k + fotos.length) % fotos.length; img.src = fotos[i]; n.textContent = (i + 1) + ' de ' + fotos.length; v.querySelector('.visor-ant').hidden = v.querySelector('.visor-sig').hidden = fotos.length < 2; };
    const cerrar = () => { v.remove(); document.body.style.overflow = ''; document.removeEventListener('keydown', tecla); };
    const tecla = e => { if (e.key === 'Escape') cerrar(); if (e.key === 'ArrowRight') ver(i + 1); if (e.key === 'ArrowLeft') ver(i - 1); };
    v.querySelector('.visor-x').onclick = cerrar; v.querySelector('.visor-ant').onclick = () => ver(i - 1); v.querySelector('.visor-sig').onclick = () => ver(i + 1);
    v.addEventListener('click', e => { if (e.target === v) cerrar(); }); document.addEventListener('keydown', tecla);
    let x0 = null; v.addEventListener('touchstart', e => { x0 = e.touches[0].clientX; }, {passive: true});
    v.addEventListener('touchend', e => { if (x0 === null) return; const dx = e.changedTouches[0].clientX - x0; if (Math.abs(dx) > 40) ver(i + (dx < 0 ? 1 : -1)); x0 = null; });
    ver(i);
  }

  if (!eb) { noEncontrada('Falta el código de la propiedad en la dirección.'); return; }
  AM.inventario().then(todas => {
    const p = todas.find(x => x.eb === eb && (!op || x.operacion === op)) || todas.find(x => x.eb === eb);
    if (!p) { noEncontrada('El código ' + eb + ' ya no está en nuestro inventario. Puede haberse rentado o vendido.'); return; }
    pintar(p, todas);
  }).catch(e => { console.error('ficha:', e); noEncontrada('No se pudo mostrar la propiedad. Recarga la página; si sigue igual, avísanos por WhatsApp.'); });
})();
</script>
</body>
</html>
