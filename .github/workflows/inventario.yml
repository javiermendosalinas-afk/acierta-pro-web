name: Actualizar inventario

# Trae el inventario de aciertamax.com, lo clasifica (vivienda/comercial), aplica las
# guardas de precio y publica data.json en acierta.pro, mas el archivo para ChatGPT.
# Corre solo el dia 3 de cada mes y tambien a mano desde la pestana Actions ->
# "Actualizar inventario" -> Run workflow.
on:
  schedule:
    - cron: '0 11 3,18 * *'   # quincenal: dias 3 y 18, 05:00 hora de Guadalajara
  push:
    paths:
      - 'herramientas/disparar_inventario.txt'   # subir una marca en este archivo tambien la arranca
  workflow_dispatch:
    inputs:
      prueba:
        description: 'Prueba rapida (2 paginas por zona, no publica nada)'
        type: boolean
        default: false

permissions:
  contents: write
  pages: write

concurrency:
  group: inventario
  cancel-in-progress: false

jobs:
  sincronizar:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: pip install requests beautifulsoup4 pillow openpyxl

      - name: Definir modo (prueba o completa)
        id: modo
        shell: bash
        run: |
          P=false
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then P="${{ inputs.prueba }}"; fi
          if [ "${{ github.event_name }}" = "push" ] && grep -qi "prueba" herramientas/disparar_inventario.txt; then P=true; fi
          echo "prueba=$P" >> "$GITHUB_OUTPUT"
          echo "Modo prueba: $P"

      - name: Sincronizar inventario
        shell: bash
        env:
          EASYBROKER_API_KEY: ${{ secrets.EASYBROKER_API_KEY }}
        run: |
          mkdir -p reportes/inventario
          if [ "${{ steps.modo.outputs.prueba }}" = "true" ]; then
            ARGS="--paginas-max 2 --sin-escribir"
          else
            ARGS=""
          fi
          python -u herramientas/inventario_sync.py $ARGS 2>&1 | tee "$RUNNER_TEMP/corrida.log"

      - name: Inventario compartido de NeoJaus (bolsa AMPI)
        if: ${{ steps.modo.outputs.prueba != 'true' }}
        shell: bash
        run: |
          python -u herramientas/neojaus_sync.py --max-minutos 200 2>&1 | tee -a "$RUNNER_TEMP/corrida.log" || echo "NeoJaus fallo: se conserva EasyBroker"

      - name: Guardar bitacora de la corrida
        if: always()
        shell: bash
        run: |
          mkdir -p reportes/inventario
          tail -n 150 "$RUNNER_TEMP/corrida.log" > reportes/inventario/ultima_corrida.log || true

      - name: Publicar cambios
        if: always()
        shell: bash
        run: |
          git config user.name "inventario-bot"
          git config user.email "inventario-bot@users.noreply.github.com"
          git add reportes/inventario
          if [ "${{ steps.modo.outputs.prueba }}" != "true" ]; then
            python -u herramientas/generar_seo.py || echo "Paginas para buscadores: fallo, se publica el resto"
            git add data.json inventario.csv inventario-meta.json inventario-chatgpt.csv inventario-chatgpt.xlsx herramientas/neojaus herramientas/eb_terrenos.json.gz 2>/dev/null || true
            git add propiedades zonas sitemap-propiedades-*.xml sitemap-zonas.xml robots.txt seo.css 2>/dev/null || true
          fi
          if git diff --cached --quiet; then
            echo "Sin cambios que publicar"
          else
            git commit -m "Inventario: corrida $(date -u +%F)"
            git pull --rebase -q || true
            git push
          fi

      - name: Pedir publicacion del sitio
        if: ${{ steps.modo.outputs.prueba != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
