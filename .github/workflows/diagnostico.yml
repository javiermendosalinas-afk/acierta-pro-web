name: Diagnostico de claves EB

# Revisa en aciertamax.com por qué ciertas claves EB no llegan al inventario.
# Se lanza cambiando herramientas/diagnostico/claves.txt (una clave por línea).
on:
  push:
    paths:
      - 'herramientas/diagnostico/claves.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnosticar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4 pillow openpyxl
      - name: Diagnosticar
        run: python herramientas/diagnostico/diagnostico_eb.py $(grep -o 'EB-[A-Z0-9]*' herramientas/diagnostico/claves.txt)
      - name: Guardar resultado
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add reportes/diagnostico/resultado.md
          git commit -m "Diagnostico de claves EB" || echo "sin cambios"
          git pull --rebase -q || true
          git push
