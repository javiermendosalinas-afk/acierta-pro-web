name: Muestra de fichas NeoJaus
on:
  push:
    paths:
      - 'herramientas/disparar_muestra_nj.txt'
permissions:
  contents: write
jobs:
  muestra:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - run: python herramientas/muestra_neojaus.py
      - run: |
          git config user.name "inventario-bot"; git config user.email "inventario-bot@users.noreply.github.com"
          git add herramientas/neojaus/muestra_ficha.json && git commit -m "Muestra de fichas NeoJaus" && git pull --rebase -q && git push || true
